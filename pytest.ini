[pytest]
# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Output verbosity
addopts =
    --verbose
    --strict-markers
    --strict-config
    --showlocals
    --tb=short
    # Coverage options
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    # Warnings
    -W error
    -W ignore::DeprecationWarning
    -W ignore::PendingDeprecationWarning

# Minimum coverage percentage
[coverage:run]
source = .
omit =
    */tests/*
    */test_*
    *_test.py
    */venv/*
    */env/*
    */langgragh-chatbot/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
skip_empty = True
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

# Test markers
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow tests that should be run less frequently
    require_credentials: Tests that require API credentials
